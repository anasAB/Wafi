# Wafi PowerSync Sync Streams (edition 3)
#
# Deploy this in the PowerSync dashboard → Sync Streams editor (this repo file is
# the source of record; the dashboard is what actually runs).
#
# Per-shop scoping WITHOUT a custom JWT claim: every row is filtered through the
# shops.owner_user_id → auth.user_id() mapping. auth.user_id() is the token's
# `sub`, always present — so this needs no access-token hook and no app_metadata
# claim on the server side. One Supabase account == one shop (Sub-project 1).
#
# Docs: https://docs.powersync.com/sync/streams/overview
#
# ⚠️ VERIFY ON DEPLOY: the `WHERE shop_id IN (SELECT … )` correlated-subquery
# shape below must be accepted by the Sync Streams validator. Edition 3 is more
# permissive than classic sync rules (which rejected subqueries in data queries),
# but confirm it saves without error in the dashboard. If it is REJECTED, switch
# to the parameter-query form — resolve the shop once as a subscription parameter,
# then filter every table by it:
#
#   streams:
#     shop_data:
#       auto_subscribe: true
#       parameters: SELECT id AS shop_id FROM public.shops WHERE owner_user_id = auth.user_id()
#       queries:
#         - SELECT * FROM public.shops    WHERE id      = subscription.parameter('shop_id')
#         - SELECT * FROM public.products WHERE shop_id = subscription.parameter('shop_id')
#         # …one line per tenant table, all keyed on subscription.parameter('shop_id')
#
# The parameter form is also cheaper (one shop lookup vs. a subquery per table).
config:
  edition: 3

streams:
  shop_data:
    auto_subscribe: true
    queries:
      # ⚠️ VERIFY ON DEPLOY (WAFI-122): confirm `request.jwt() ->> 'active_role'`
      # is a valid accessor in this PowerSync edition/version, and that the
      # Customize Access Token Hook (migration 046, enabled in the dashboard
      # per that migration's Task 3) is actually live BEFORE deploying this
      # file — otherwise every session's active_role claim is absent and every
      # row falls through neither branch (visible as missing data, not a
      # security hole, but confirm the failure mode in staging first).

      # The shop itself (and its devices) for the owning account.
      - SELECT * FROM public.shops   WHERE owner_user_id = auth.user_id()
      - SELECT * FROM public.devices WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # All tenant data, scoped to the account's shop.

      # WAFI-122: cost_price_usd withheld from cashier sessions (server-side
      # enforcement — see ADR-009). Column list here must be kept in sync with
      # products' full column list minus cost_price_usd; verify against
      # src/data/powersync/schema.ts and supabase/migrations for the current
      # authoritative column list before each edit, since this list will drift
      # as products gains columns.
      - SELECT id, shop_id, name_ar, name_en, price_usd, barcode, category,
               category_id, subcategory_id, photo_url, current_stock,
               low_stock_threshold, is_active, deleted, sync_status,
               created_at, updated_at
        FROM public.products
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') = 'cashier'
      - SELECT * FROM public.products
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') IN ('owner', 'manager')

      - SELECT * FROM public.stock_adjustments          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.sales                      WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-122: unit_cost_usd withheld from cashier sessions (server-side
      # enforcement — see ADR-009). Column list here must be kept in sync with
      # sale_line_items' full column list minus unit_cost_usd; verify against
      # src/data/powersync/schema.ts before each edit.
      - SELECT id, sale_id, shop_id, product_id, quantity, unit_price_usd,
               line_total_usd
        FROM public.sale_line_items
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') = 'cashier'
      - SELECT * FROM public.sale_line_items
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') IN ('owner', 'manager')
      - SELECT * FROM public.exchange_rates             WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-122: expenses carry no non-cost data cashiers need — entire table
      # withheld from cashier sessions (server-side enforcement — see ADR-009).
      - SELECT * FROM public.expenses
        WHERE false
          AND (request.jwt() ->> 'active_role') = 'cashier'
      - SELECT * FROM public.expenses
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') IN ('owner', 'manager')

      - SELECT * FROM public.customers                  WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.customer_payments          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.installment_plans          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.installment_dues           WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.receipt_settings           WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.sale_payments              WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.staff                      WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.cashier_shifts             WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.returns                    WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.return_line_items          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.return_reasons             WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.audit_log                  WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-122: suppliers currently carries no cost/payment-term columns
      # (verified against src/data/powersync/schema.ts — shop_id, name, phone,
      # contact_person, address, notes, deleted, created_at, sync_status only).
      # No role-branching needed today; re-check this table's column list
      # before adding any cost/payment-term field and branch it then.
      - SELECT * FROM public.suppliers                  WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-122: total_cost_usd withheld from cashier sessions (server-side
      # enforcement — see ADR-009). Column list here must be kept in sync with
      # stock_receivings' full column list minus total_cost_usd; verify
      # against src/data/powersync/schema.ts before each edit.
      - SELECT id, shop_id, supplier_id, received_at, invoice_photo_url,
               exchange_rate_at_receiving, notes, staff_id, sync_status
        FROM public.stock_receivings
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') = 'cashier'
      - SELECT * FROM public.stock_receivings
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') IN ('owner', 'manager')

      # WAFI-122: unit_cost_usd withheld from cashier sessions (server-side
      # enforcement — see ADR-009). Column list here must be kept in sync with
      # stock_receiving_line_items' full column list minus unit_cost_usd;
      # verify against src/data/powersync/schema.ts before each edit.
      - SELECT id, receiving_id, shop_id, product_id, qty_received,
               cost_updated, sync_status
        FROM public.stock_receiving_line_items
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') = 'cashier'
      - SELECT * FROM public.stock_receiving_line_items
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') IN ('owner', 'manager')

      - SELECT * FROM public.cash_movements             WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.stock_take_sessions        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-122: variance_value_usd withheld from cashier sessions (server-side
      # enforcement — see ADR-009). Column list here must be kept in sync with
      # stock_take_lines' full column list minus variance_value_usd; verify
      # against src/data/powersync/schema.ts before each edit.
      - SELECT id, session_id, shop_id, product_id, expected_stock,
               counted_stock, variance, sync_status
        FROM public.stock_take_lines
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') = 'cashier'
      - SELECT * FROM public.stock_take_lines
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') IN ('owner', 'manager')

      - SELECT * FROM public.categories                 WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.subcategories              WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-122 / WAFI-138: staff_ledger and staff_settlements were not
      # previously synced at all. Entire tables withheld from cashier sessions
      # (server-side enforcement — see ADR-009) since both carry
      # amounts/wages that are owner/manager-only financial data.
      - SELECT * FROM public.staff_ledger
        WHERE false
          AND (request.jwt() ->> 'active_role') = 'cashier'
      - SELECT * FROM public.staff_ledger
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') IN ('owner', 'manager')

      - SELECT * FROM public.staff_settlements
        WHERE false
          AND (request.jwt() ->> 'active_role') = 'cashier'
      - SELECT * FROM public.staff_settlements
        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
          AND (request.jwt() ->> 'active_role') IN ('owner', 'manager')
