# Wafi PowerSync Sync Streams (edition 3)
#
# Deploy this in the PowerSync dashboard → Sync Streams editor (this repo file is
# the source of record; the dashboard is what actually runs).
#
# Per-shop scoping WITHOUT a custom JWT claim: every row is filtered through the
# shops.owner_user_id → auth.user_id() mapping. auth.user_id() is the token's
# `sub`, always present — so this needs no access-token hook and no app_metadata
# claim on the server side. One Supabase account == one shop (Sub-project 1).
#
# Docs: https://docs.powersync.com/sync/streams/overview
#
# WAFI-122 STATUS (2026-07-19): role-based branching on `active_role` was
# attempted and REVERTED after live testing on the hosted PowerSync project.
# The `subscription.parameter(...)` / stream `parameters:` mechanism itself —
# even with ONLY `shop_id` resolved this way, with no `active_role`/
# `request.jwt()` involved at all — returned ZERO rows for every table that
# used it (`staff`, `products`, `devices`), confirmed after a full
# `disconnectAndClear()` + resync. The correlated-subquery form below (the
# ORIGINAL, proven-working shape) was restored to unblock the app. Whatever
# is wrong with the parameter-query mechanism in this specific PowerSync
# setup/version is NOT understood yet and needs investigation directly with
# PowerSync's own docs/support before role-branching can be attempted again —
# see ADR-009's Design Correction section for the full history of what was
# tried. `staff_ledger`/`staff_settlements` (new WAFI-138 tables) and
# `sale_line_items` (already existed, was previously unsynced as a distinct
# line — now added) are synced UNBRANCHED (full data, all roles) below as a
# stopgap: WAFI-122's server-side role enforcement is NOT live. Cost/expense
# data is currently visible to every role via sync, same as before this
# ticket — client-side gating (`permissions.ts`) is the only protection,
# exactly the pre-WAFI-122 state this ticket exists to fix.
config:
  edition: 3

streams:
  shop_data:
    auto_subscribe: true
    queries:
      # The shop itself (and its devices) for the owning account.
      - SELECT * FROM public.shops   WHERE owner_user_id = auth.user_id()
      - SELECT * FROM public.devices WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # All tenant data, scoped to the account's shop.
      - SELECT * FROM public.products                   WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.stock_adjustments          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.sales                      WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.sale_line_items            WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.exchange_rates             WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.expenses                   WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.customers                  WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.customer_payments          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.installment_plans          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.installment_dues           WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.receipt_settings           WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.sale_payments              WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.staff                      WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.cashier_shifts             WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.returns                    WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.return_line_items          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.return_reasons             WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.audit_log                  WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.suppliers                  WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.stock_receivings           WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.stock_receiving_line_items WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.cash_movements             WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.stock_take_sessions        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.stock_take_lines           WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.categories                 WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.subcategories              WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-138: previously unsynced. Synced unbranched for now (see
      # WAFI-122 STATUS note above — role-branching is not yet functional).
      - SELECT * FROM public.staff_ledger               WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.staff_settlements          WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.denomination_configs       WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-151: needed for client-side rebuild of local_today_revenue_projection.
      # PowerSync sync rules can't filter on now()/interval -- bucket membership
      # must be deterministic from row data, not wall-clock time (a row silently
      # leaving a time-window bucket produces no diff event, so clients would
      # never learn to drop it). The 14-day bound from the design spec is
      # therefore enforced client-side, in the SQLite query the projection
      # rebuild runs against the local synced `events` table, not here.
      - SELECT * FROM public.events              WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.daily_event_counts   WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-153: profit_cache, same pattern as daily_event_counts above.
      - SELECT * FROM public.profit_cache         WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-147B: generated_reports, additionally filtered by can_view_reports --
      # unlike every other bucket in this file, which is shop-scope only. This is
      # the first permission-filtered sync rule in this codebase.
      #
      # ** UNVERIFIED / HIGH RISK **: this uses `auth.parameters() ->> 'staff_id'`
      # to resolve the requesting device's staff identity. The WAFI-122 STATUS note
      # at the top of this file documents that this project's `subscription.parameter(...)`
      # / stream `parameters:` mechanism -- the client-supplied-parameter mechanism,
      # of which auth.parameters() is the same family -- was tried live on this
      # exact hosted PowerSync project and returned ZERO rows for every table that
      # used it (staff/products/devices), even for the simplest case (only shop_id
      # resolved this way). That attempt was reverted; the root cause was never
      # diagnosed (see ADR-009's Design Correction section). This bucket has NOT
      # been re-tested against a live device/session in this task -- do not trust
      # it in production until it is. If it reproduces the WAFI-122 zero-row
      # failure, the fallback is NOT to sync this table unbranched (full data to
      # every role) -- that would leak permission-gated report data at the sync
      # layer -- fall back instead to resolving staff identity a different way
      # (e.g. a server-side staff-session table keyed by device, joined only on
      # auth.user_id()) before re-enabling this bucket.
      - SELECT generated_reports.* FROM public.generated_reports
          JOIN public.shops sh ON sh.id = generated_reports.shop_id AND sh.owner_user_id = auth.user_id()
          JOIN public.staff st ON st.shop_id = generated_reports.shop_id AND st.id::text = auth.parameters() ->> 'staff_id'
          WHERE st.role = 'owner' OR (st.permissions ->> 'can_view_reports') = 'true'

      # WAFI-147B: generated_report_staff_sections -- owner-only, raw role check
      # (NOT the can_view_reports flag above). See design spec's explicit
      # correction: permissionsForRole() does not trust the stored permissions
      # blob for can_view_staff_performance on non-owners, so this sync rule
      # must not either -- hence a role check, not a permissions-blob read.
      # Same UNVERIFIED auth.parameters() risk as generated_reports above --
      # this table holds staff performance data, so it is MORE sensitive than
      # generated_reports if the parameter mechanism fails open instead of
      # closed. Verify zero-row-vs-full-row failure mode against a live device
      # before trusting this in production.
      - SELECT generated_report_staff_sections.* FROM public.generated_report_staff_sections
          JOIN public.shops sh ON sh.id = generated_report_staff_sections.shop_id AND sh.owner_user_id = auth.user_id()
          JOIN public.staff st ON st.shop_id = generated_report_staff_sections.shop_id AND st.id::text = auth.parameters() ->> 'staff_id'
          WHERE st.role = 'owner'

      # WAFI-156: business_rules config, synced so RulesScreen.vue can list/edit.
      # rule_action_log is deliberately NOT synced -- server-only execution ledger.
      - SELECT * FROM public.business_rules       WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())

      # WAFI-148: health_metrics/health_gauges read models, so OwnerHealthPage.vue
      # (gated by can_view_health_metrics) can read synced health data. No client
      # CRUD policy exists on either table (migration 107) -- all writes go through
      # the report_health_metrics RPC and the server-side apply functions, so these
      # are read-only sync buckets, same shop-scope shape as every other table above.
      - SELECT * FROM public.health_metrics       WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
      - SELECT * FROM public.health_gauges        WHERE shop_id IN (SELECT id FROM public.shops WHERE owner_user_id = auth.user_id())
